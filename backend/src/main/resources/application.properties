spring.application.name=finance-dashboard

server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/finance_dashboard}
spring.datasource.username=${DB_USERNAME:finance_user}
spring.datasource.password=${DB_PASSWORD:finance_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

jwt.secret=${JWT_SECRET:super-secret-key-change-me-super-secret-key-change-me}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
