spring.application.name=finance-dashboard

server.port=8080

spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/finance_dashboard}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

jwt.secret=${JWT_SECRET:super-secret-key-change-me-super-secret-key-change-me}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Mail sender / verification settings
app.mail.from=${MAIL_FROM:noreply@finance-dashboard.local}
auth.verification.expiration-minutes=${AUTH_VERIFICATION_EXPIRATION_MINUTES:10}

# SMTP configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
