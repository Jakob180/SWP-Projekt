<section class="chart-panel">
  <header>{{ title }}</header>
  <div class="canvas-wrapper">
    <canvas #chartCanvas></canvas>
    <div class="empty-state" *ngIf="!hasData()">{{ emptyMessage }}</div>
  </div>
  <div class="legend-list" *ngIf="showLegend">
    <div class="legend-item" *ngFor="let item of legendItems" [attr.title]="item.label">
      <span class="legend-swatch" [style.background]="item.color"></span>
      <span class="legend-label">{{ item.label }}</span>
    </div>
  </div>
</section>
